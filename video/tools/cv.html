<!doctype html><html><body style="margin:0;background:#fff">
<canvas id="c"></canvas>
<script type="module">
import * as pdfjs from "/node_modules/pdfjs-dist/build/pdf.mjs";
pdfjs.GlobalWorkerOptions.workerSrc = "/node_modules/pdfjs-dist/build/pdf.worker.mjs";
const doc = await pdfjs.getDocument({ url: "/repo/public/samples/kavin-raj-synthetic-cv.pdf", cMapUrl: "/node_modules/pdfjs-dist/cmaps/", cMapPacked: true, standardFontDataUrl: "/node_modules/pdfjs-dist/standard_fonts/" }).promise;
const page = await doc.getPage(1);
const scale = 3;
const viewport = page.getViewport({ scale });
const canvas = document.getElementById("c");
canvas.width = viewport.width; canvas.height = viewport.height;
await page.render({ canvasContext: canvas.getContext("2d"), viewport }).promise;
const content = await page.getTextContent();
const items = content.items.filter((i) => i.str.trim()).map((i) => {
  const tx = pdfjs.Util.transform(viewport.transform, i.transform);
  const h = Math.hypot(tx[2], tx[3]);
  return { str: i.str, x: tx[4], y: tx[5] - h, w: i.width * scale, h };
});
window.__result = { width: viewport.width, height: viewport.height, scale, items, png: canvas.toDataURL("image/png") };
</script></body></html>
