name: Refresh data

on:
  schedule:
    - cron: "0 2 * * 1" # Mondays 02:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      # Large source files (O*NET, Anthropic Economic Index) rarely change; keep them between runs.
      - uses: actions/cache@v4
        with:
          path: .cache/pipeline
          key: pipeline-sources-${{ github.run_id }}
          restore-keys: pipeline-sources-

      - run: npm ci
      - name: Refresh and validate dataset and site
        run: npm run data:refresh
      - name: Update synthetic evaluation evidence
        run: npm run evaluate

      - name: Commit if changed
        run: |
          if git diff --quiet -- src/data/dataset.json docs/evaluation-report.md docs/evaluation-results.json; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "skilltide-bot"
          git config user.email "skilltide-bot@users.noreply.github.com"
          git add src/data/dataset.json docs/evaluation-report.md docs/evaluation-results.json
          git commit -m "Refresh data $(date -u +%Y-%m-%d)"
          git push
          # GITHUB_TOKEN pushes do not trigger Actions; validate explicitly.
          # Cloudflare Workers Builds receives the repository push independently.
          gh workflow run ci.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
